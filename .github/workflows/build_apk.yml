name: Build Sunmi T2 POS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Tải mã nguồn từ Repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt Java 17 cho Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: 4. Tự động tạo khung Project Android & Cấu hình cho Sunmi T2
        run: |
          # Lưu tạm file main.dart của bạn
          cp lib/main.dart /tmp/main_backup.dart
          
          # Tạo khung project Android chuẩn
          flutter create --org com.lachuoi --project-name pos_sunmi_t2 --platforms=android .
          
          # Xóa thư mục test mặc định
          rm -rf test
          
          # Khôi phục lại file main.dart của bạn
          cp /tmp/main_backup.dart lib/main.dart

          # Tạo file pubspec.yaml chuẩn
          printf "name: pos_sunmi_t2\ndescription: Local POS for Sunmi T2\npublish_to: 'none'\nversion: 1.0.0+1\n\nenvironment:\n  sdk: '>=3.0.0 <4.0.0'\n\ndependencies:\n  flutter:\n    sdk: flutter\n  sqflite: ^2.3.0\n  path: ^1.8.3\n  path_provider: ^2.1.1\n  intl: ^0.18.1\n  http: ^1.1.0\n  sunmi_printer_plus: ^2.1.3\n\nflutter:\n  uses-material-design: true\n" > pubspec.yaml

          # Ghi đè file android/build.gradle chuẩn (Đặt khối xử lý namespace TRƯỚC evaluationDependsOn để tránh lỗi afterEvaluate)
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                          compileSdkVersion 34
                          defaultConfig {
                              minSdkVersion 21
                          }
                      }
                  }
              }
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # Đảm bảo minSdkVersion = 21 và compileSdkVersion = 34 trong android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk .*/compileSdkVersion 34/g' android/app/build.gradle || true

          # Cấp quyền Internet và Lưu file CSV vào AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

      - name: 5. Tải thư viện và Biên dịch ra file APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: 6. Xuất file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: LaChuoi-POS-SunmiT2-APK
          path: build/app/outputs/flutter-apk/app-release.apk
