name: Build Sunmi T2 POS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tải mã nguồn từ Repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt Java 17 cho Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: 4. Tự động tạo khung Project Android & Cấu hình cho Sunmi T2
        run: |
          # Lưu tạm file main.dart của bạn
          cp lib/main.dart /tmp/main_backup.dart
          
          # Tự động sinh toàn bộ cấu trúc thư mục Android chuẩn
          flutter create --org com.lachuoi --project-name pos_sunmi_t2 .
          
          # Khôi phục lại file main.dart của bạn
          cp /tmp/main_backup.dart lib/main.dart

          # Tự động ghi đè file pubspec.yaml với đầy đủ thư viện máy in Sunmi & SQLite
          cat << 'EOF' > pubspec.yaml
          name: pos_sunmi_t2
          description: Local POS for Sunmi T2 (Ocha Style)
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.0
            path: ^1.8.3
            path_provider: ^2.1.1
            intl: ^0.19.0
            http: ^1.1.0
            sunmi_printer_plus: ^2.1.3

          flutter:
            uses-material-design: true
          EOF

          # Đảm bảo minSdkVersion = 21 để chạy mượt trên Android 7.1.1 (API 25) của Sunmi T2
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true

          # Cấp quyền Internet và Lưu file CSV vào AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

      - name: 5. Tải thư viện và Biên dịch ra file APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: 6. Xuất file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: LaChuoi-POS-SunmiT2-APK
          path: build/app/outputs/flutter-apk/app-release.apk
