name: Build Sunmi T2 POS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Tải mã nguồn từ Repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: 4. Tự động tạo Project và giải mã Source Code chuẩn 100%
        run: |
          rm -rf android build lib test pubspec.yaml pubspec.lock
          flutter create --org com.lachuoi --project-name pos_sunmi_t2 --platforms=android .
          rm -rf test

          flutter pub add sqflite:^2.3.0 path:^1.8.3 path_provider:^2.1.1 intl:^0.18.1 http:^1.1.0 sunmi_printer_plus:^2.1.3

          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk .*/compileSdkVersion 34/g' android/app/build.gradle || true

          find /home/runner/.pub-cache -name "build.gradle" -path "*sunmi_printer_plus*" -exec sed -i '/android {/a \    namespace "br.com.brasizza.sunmi_printer_plus"' {} +

          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

          # Tự động giải mã Base64 ra file lib/main.dart chuẩn (không bao giờ bị lỗi ký tự trình duyệt)
          base64 -d << 'EOF' > lib/main.dart
